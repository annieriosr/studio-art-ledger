  <style>
    /*
      White cube gallery wall label. A5 landscape (210 x 148 mm).
      Same visual system as certificado. No image — gallery labels are text only.
    */

    :root {
      --paper: #f7f5f1;
      --ink: #1c1916;
      --ink-soft: #6a645c;
      --rule: #d4cfc6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #cfc9bf;
      color: var(--ink);
      font-family: "Ibarra Real Nova", Palatino, "Times New Roman", serif;
      font-weight: 400;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 56px;
      gap: 24px;
    }

    .print-bar {
      width: 210mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .print-bar span {
      font-size: 12px;
      color: #5a544c;
      letter-spacing: 0.06em;
    }

    .print-bar button {
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: lowercase;
      background: transparent;
      border: 1px solid #8a847a;
      color: #3a3530;
      padding: 7px 16px;
      cursor: pointer;
    }

    .print-bar button:hover,
    .print-bar button:focus-visible {
      background: #3a3530;
      color: #f7f5f1;
      outline: none;
    }

    /* Card sheet — A5 landscape */
    .sheet {
      width: 210mm;
      min-height: 148mm;
      background: var(--paper);
      padding: 12mm 14mm 10mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ── Masthead ── */
    .mast {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 4mm;
      margin-bottom: 6mm;
      border-bottom: 1px solid var(--ink);
    }

    .studio {
      font-size: 10pt;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .reg {
      font-size: 9pt;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--ink-soft);
    }

    /* ── Main block ── */
    .work-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4mm 0;
    }

    .work-title {
      font-size: 20pt;
      font-style: italic;
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 4mm;
      letter-spacing: -0.01em;
    }

    .work-meta {
      font-size: 11pt;
      line-height: 1.6;
      color: var(--ink-soft);
    }

    .work-meta .year {
      color: var(--ink);
      font-weight: 600;
    }

    /* ── Exhibition footer ── */
    .exhibition {
      margin-top: 5mm;
      padding-top: 4mm;
      border-top: 1px solid var(--rule);
      font-size: 9.5pt;
      color: var(--ink-soft);
      letter-spacing: 0.02em;
      line-height: 1.5;
    }


    /* QR code block */
    .qr-row {
      display: flex;
      align-items: center;
      gap: 4mm;
      margin-top: 4mm;
      padding-top: 3mm;
      border-top: 0.4pt solid var(--rule);
    }
    .qr-img {
      width: 16mm;
      height: 16mm;
      flex-shrink: 0;
    }
    .qr-label {
      font-size: 6.5pt;
      color: var(--ink-soft);
      line-height: 1.6;
      letter-spacing: 0.02em;
    }
    .qr-url {
      font-size: 6pt;
      color: var(--ink-soft);
      word-break: break-all;
    }
    [contenteditable="true"]:focus { outline: none; }

    /* ── Print ── */
    @media screen and (max-width: 900px) {
      body { background: var(--paper); padding: 0; }
      .print-bar, .sheet { width: 100%; }
      .print-bar { padding: 12px 16px; }
      .sheet { min-height: auto; padding: 24px 20px; }
    }

    @media print {
      html, body { background: white; padding: 0; }
      .print-bar { display: none; }
      .sheet { width: auto; min-height: auto; padding: 0; }
      @page {
        size: A5 landscape;
        margin: 12mm 14mm;
      }
    }
  </style>
</head>

    function dims(w) {
      const h = w.height_cm || w.h;
      const wd = w.width_cm || w.w;
      const parts = [h, wd].filter((x) => x != null && x !== "");
      if (!parts.length) return "alto × ancho cm";
      return parts.join(" × ") + " cm";
    }

      document.getElementById("field-dims").textContent = dims(w);
      document.getElementById("field-reg").textContent = w.id;
      document.title = "Tarjeta - " + w.id;
      // QR code
      if (w.qr_b64 && w.exhibition_url) {
        document.getElementById('qr-img').src = w.qr_b64;
        document.getElementById('qr-url').textContent = w.exhibition_url;
        document.getElementById('qr-row').style.display = 'flex';
      }

    })();
  </script>

</body>
</html>
